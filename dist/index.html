<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#09090d"><title>nghy</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="gate"><div class="halo" aria-hidden="true"></div><div id="entry"><button id="open">continue</button></div><div id="record-choices" hidden><div class="confirm-actions"><button id="choose-record" aria-describedby="record-notice">record</button><button id="without-recording">without record</button></div><p id="record-notice">continuing starts recording</p><p id="record-error" role="status"></p></div><div id="confirmation" hidden><p>are you sure?</p><div class="confirm-actions"><button id="yes">yes</button><button id="back">go back</button></div></div></div>
<div id="record-status" hidden><span>● recording</span><button id="stop-recording">stop</button></div><main id="experience" hidden>
<div class="progress" id="progress"></div><button id="sound" aria-label="Pause background music">♫ Music on</button>
<div id="pixel-background" aria-hidden="true"></div><header><h1 id="dedication"></h1><img class="cat-keepsake" src="assets/tabby-love.png" alt="An orange and white tabby and a gray tabby cuddling among pixel flowers and pink ribbons"></header>
<div class="composition"><aside id="left" aria-label="Memories"></aside><article><p class="letter-opener">some things deserve to be <em>felt.</em></p><div id="paragraphs"></div><p id="signature" class="signature"></p><div class="end"><span class="closing-heart" aria-hidden="true">♡</span><span>nothing’s gonna<br>hurt you, <em>baby.</em></span></div></article><aside id="right" aria-label="More memories"></aside></div>
<section class="final-memory" aria-label="Our most special memory"><figure id="final-photo"></figure></section>
<section id="reaction" hidden><button id="end-recording">end</button><p id="reaction-note" role="status"></p><video id="reaction-video" controls playsinline hidden></video><a id="save-reaction" hidden>save recording</a><button id="delete-reaction" hidden>delete recording</button></section><div class="keepsake-download"><a href="assets/our-memory.pdf" download="our-memory.pdf">save this memory</a></div></main><audio id="audio" loop preload="none"></audio><script src="content.js"></script><script src="script.js"></script><script src="recording.js"></script></body></html>
